# nftables ruleset for a public ghost host (audit 4.3 / M6, review 1 I6).
#
# This is a TEMPLATE. install-ubuntu.sh renders it to
# /etc/ghserver/nftables-ghserver.conf with
#   @GAME_PORT@  the UDP port from /etc/ghserver/ghserver.env (PORT, default 22228)
#   @SSH_PORTS@  every TCP port sshd listens on (ssh.socket ListenStream, sshd -T)
# Edit the rendered file (for example to restrict SSH to your admin networks),
# then activate it with deploy/firewall-apply.sh, which schedules an automatic
# rollback and only keeps the rules once you confirm from a NEW ssh session.
#
# It owns ONE table, inet ghserver, and replaces that table atomically - it
# never runs "flush ruleset", so ufw, Docker and fail2ban keep their tables. The
# first line creates the table if it does not exist so the delete never fails;
# nft -f applies the whole file as one transaction.
#
# Open: loopback, established/related, SSH, DHCPv4/DHCPv6 replies, ICMPv6 (neighbour
# discovery, router advertisements), a trickle of ICMPv4, and the game port.
# Because the game port is notrack'd, the per-IP meter sees every packet (a UDP
# flow becomes ESTABLISHED as soon as the server replies, which is why a meter
# behind "ct state established accept" never bit), and a spoofed flood cannot
# fill the conntrack table and take new SSH connections down with it. Per-IP
# limits do NOT stop a flood from random spoofed sources - that needs upstream
# filtering (BCP38) or the provider's DDoS service - but they cap one address.

table inet ghserver
delete table inet ghserver

table inet ghserver {
  set gh_rate4 { type ipv4_addr; flags dynamic,timeout; timeout 60s; size 65535; }

  chain raw_pre { type filter hook prerouting priority raw; policy accept; udp dport @GAME_PORT@ notrack; }
  chain raw_out { type filter hook output priority raw; policy accept; udp sport @GAME_PORT@ notrack; }

  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    # SSH. To restrict it, put your admin networks in front, e.g.
    #   ip saddr { 203.0.113.0/24 } tcp dport { 22 } accept
    # (firewall-apply.sh refuses a ruleset with no accept for an sshd port).
    tcp dport { @SSH_PORTS@ } accept

    # DHCP replies: the lease must renew (dhcp4) and the IPv6 address must stay
    # (dhcp6). A broadcast DHCPv4 reply does not match conntrack, so it needs its
    # own rule.
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept

    # IPv6 neighbour discovery and router advertisements (the address comes by
    # RA), plus the rest of ICMPv6; a trickle of ICMPv4.
    meta l4proto ipv6-icmp accept
    meta l4proto icmp limit rate 10/second accept

    # The game (IPv4 only, like the server's socket). Nothing legitimate is
    # bigger than 512 B of payload; ~four players behind one NAT at 50 Hz plus
    # spray uploads fit under 400/s per address.
    meta nfproto ipv4 udp dport @GAME_PORT@ udp length > 520 drop
    meta nfproto ipv4 udp dport @GAME_PORT@ add @gh_rate4 { ip saddr limit rate over 400/second burst 800 packets } drop
    meta nfproto ipv4 udp dport @GAME_PORT@ accept
  }
}
